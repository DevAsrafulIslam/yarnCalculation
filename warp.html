<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Warp Yarn Calculator</title>

    <style>
      :root {
        --ink: #17211b;
        --muted: #6b776f;
        --line: #d9e1dc;
        --paper: #ffffff;
        --wash: #f2f6f1;
        --accent: #28724f;
        --accent-dark: #1c5239;
        --accent-soft: #e4f0e8;
        --danger: #b42318;
        --shadow: 0 24px 60px rgba(34, 62, 45, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      @keyframes pageEnter {
        from {
          opacity: 0;
          transform: translateY(10px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      body {
        min-width: 320px;
        margin: 0;
        padding: 32px 20px;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 10% 0%, #e3efe5, transparent 32%),
          var(--wash);
        color: var(--ink);
        animation: pageEnter 0.45s ease-out both;
      }

      @media (prefers-reduced-motion: reduce) {
        body {
          animation: none;
        }
      }

      .card {
        width: min(1120px, 100%);
        margin: auto;
        padding: clamp(22px, 4vw, 48px);
        background: var(--paper);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 24px;
        box-shadow: var(--shadow);
      }

      h1 {
        margin: 0;
        color: var(--ink);
        font-family: Georgia, serif;
        font-size: clamp(32px, 5vw, 54px);
        letter-spacing: -1.5px;
        line-height: 1;
        text-align: center;
      }

      .card::before {
        display: block;
        width: 52px;
        height: 4px;
        margin: 0 auto 18px;
        border-radius: 99px;
        background: var(--accent);
        content: "";
      }

      .yarn-selector {
        display: flex;
        gap: 8px;
        max-width: 640px;
        margin: 28px auto 34px;
        padding: 5px;
        background: #edf2ed;
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      .yarn-selector a {
        flex: 1;
        padding: 12px 16px;
        color: var(--muted);
        border-radius: 8px;
        font-size: 14px;
        font-weight: 700;
        text-align: center;
        text-decoration: none;
        transition: 0.2s ease;
      }

      .yarn-selector a:hover {
        color: var(--ink);
        background: #fff;
      }

      .yarn-selector a.active {
        color: #fff;
        background: var(--accent);
        box-shadow: 0 5px 12px rgba(40, 114, 79, 0.22);
      }

      h2 {
        margin: 34px 0 14px;
        font-size: 21px;
        letter-spacing: -0.3px;
      }

      h3 {
        margin: 0 0 16px;
        color: var(--accent-dark);
        font-size: 15px;
        letter-spacing: 0.2px;
        text-transform: uppercase;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      label {
        display: block;
        color: #405048;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.3px;
        text-transform: uppercase;
      }

      input {
        width: 100%;
        margin-top: 8px;
        padding: 13px 14px;
        color: var(--ink);
        background: #fbfdfb;
        border: 1px solid var(--line);
        border-radius: 9px;
        font: inherit;
        font-size: 15px;
        outline: none;
        transition: 0.2s ease;
      }

      input::placeholder {
        color: #a0aba4;
      }

      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(40, 114, 79, 0.12);
      }

      .note {
        margin-top: 18px;
        padding: 12px 14px;
        color: var(--muted);
        background: #f7faf7;
        border-left: 3px solid var(--accent);
        border-radius: 6px;
        font-size: 12px;
        line-height: 1.6;
      }

      .radio {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        margin: 18px 0 12px;
      }

      .radio label {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 13px;
        color: var(--muted);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
        letter-spacing: 0;
        text-transform: none;
      }

      .radio input {
        width: auto;
        margin: 0;
        accent-color: var(--accent);
      }

      .radio label:has(input:checked) {
        color: var(--accent-dark);
        background: var(--accent-soft);
        border-color: #9ac7aa;
      }

      .section {
        margin-top: 16px;
        padding: 20px;
        background: #fbfdfb;
        border: 1px solid var(--line);
        border-radius: 13px;
      }

      #multipleInput .radio {
        margin: 8px 0 12px;
      }

      #ratioBox,
      #percentBox {
        grid-column: 3;
        width: 100%;
        min-width: 0;
      }

      #multipleInput .distribution-controls > div input {
        width: 100%;
        min-width: 0;
        padding: 10px 9px;
        font-size: 13px;
      }

      #multipleInput .distribution-controls {
        display: grid;
        grid-template-columns: minmax(76px, 0.8fr) minmax(54px, 0.6fr) minmax(
            0,
            1.6fr
          );
        align-items: center;
      }

      #multipleInput .distribution-controls > label {
        justify-content: center;
        min-width: 0;
        padding-right: 8px;
        padding-left: 8px;
      }

      .calc {
        width: 100%;
        margin-top: 28px;
        padding: 15px 20px;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 10px;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
        transition: 0.2s ease;
      }

      .calc:hover {
        background: var(--accent-dark);
        transform: translateY(-1px);
      }

      .error {
        margin-top: 14px;
        color: var(--danger);
        font-size: 13px;
        font-weight: 700;
      }

      .ok,
      .bad {
        margin-top: 14px;
        padding: 13px 15px;
        border-radius: 9px;
        font-size: 13px;
        font-weight: 700;
      }

      .ok {
        color: #17633d;
        background: #e8f5ec;
        border: 1px solid #b9ddc4;
      }

      .bad {
        color: var(--danger);
        background: #fff0ee;
        border: 1px solid #f2c2bc;
      }

      .table-wrap {
        width: 100%;
        margin-top: 14px;
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      table {
        width: 100%;
        min-width: 820px;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 12px;
      }

      th,
      td {
        padding: 12px 13px;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        text-align: center;
        white-space: nowrap;
      }

      th:last-child,
      td:last-child {
        border-right: 0;
      }

      thead tr:first-child th {
        border-top: 0;
      }

      th {
        color: #000;
        background: var(--accent-soft);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.4px;
        text-transform: none;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      tbody tr:nth-child(even) {
        background: #ffffff;
      }

      tbody td {
        color: #000;
        background: #f0f8f2;
        font-size: 19px;
        font-weight: 600;
      }

      tbody td,
      tbody td b {
        color: #000;
        /* font-weight: 800; */
      }

      .footer {
        margin-top: 32px;
        padding-top: 18px;
        color: #97a49b;
        border-top: 1px solid var(--line);
        font-size: 12px;
        text-align: center;
      }

      .copyright {
        color: var(--accent-dark);
        font-weight: 700;
      }

      @media (max-width: 640px) {
        body {
          padding: 12px 8px;
        }

        .card {
          padding: 24px 16px;
          border-radius: 18px;
        }

        .yarn-selector {
          margin: 24px auto 28px;
        }

        .yarn-selector a {
          padding: 11px 8px;
          font-size: 12px;
        }

        .grid {
          grid-template-columns: 1fr;
          gap: 14px;
        }

        .section {
          padding: 16px;
        }

        h2 {
          font-size: 19px;
        }

        .radio label {
          flex: 1 1 130px;
          justify-content: center;
        }

        #ratioBox,
        #percentBox {
          grid-column: 3;
        }

        #multipleInput .distribution-controls {
          grid-template-columns: minmax(72px, 0.8fr) minmax(48px, 0.6fr) minmax(
              0,
              1.6fr
            );
          gap: 6px;
        }

        #multipleInput .distribution-controls > label {
          padding: 10px 6px;
        }

        #multipleInput .distribution-controls input[type="radio"] {
          margin-right: 2px;
        }
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>Yarn Calculator</h1>

      <div class="yarn-selector">
        <a href="warp.html" class="active"> Warp Yarn </a>

        <a href="weft.html"> Weft Yarn </a>
      </div>

      <div class="grid">
        <div>
          <label>TE (Optional)</label>

          <input id="te" type="number" step="any" placeholder="e.g. 5536" />
        </div>

        <div>
          <label>Reed Space</label>

          <input
            id="reed"
            type="number"
            step="any"
            placeholder="TE দিলে → Reed Space লাগবে না।"
          />
        </div>

        <div>
          <label>EPI</label>

          <input
            id="epi"
            type="number"
            step="any"
            placeholder="TE দিলে → EPI লাগবে না।"
          />
        </div>
        <div class="">
          <div>
            <label>Total Ball</label>

            <input id="totalBall" type="number" step="any" value="12" />
          </div>
        </div>
      </div>

      <div class="note">
        Number of Cone = TE ÷ Total Ball. Decimal 0.5 or more হলে +1 হবে।
      </div>

      <div class="radio">
        <label>
          <input
            type="radio"
            name="mode"
            value="single"
            checked
            onchange="modeChange()"
          />
          Single Yarn
        </label>

        <label>
          <input
            type="radio"
            name="mode"
            value="multiple"
            onchange="modeChange()"
          />
          Multiple Yarn
        </label>
      </div>

      <div class="section" id="singleInput">
        <h3>Single Yarn</h3>
        <div class="grid">
          <div>
            <label>Yarn Count</label>

            <input
              id="singleCount"
              type="number"
              step="any"
              value="10"
              placeholder="10"
            />
          </div>
        </div>
      </div>

      <div class="grid">
        <div>
          <label>Set Length (Mtr)</label>

          <input id="fabric" type="number" step="any" value="1000" />
        </div>

        <div>
          <label>Wastage</label>

          <input id="wastage" type="number" step="any" value="500" />
        </div>
      </div>

      <div class="section" id="multipleInput" style="display: none">
        <h3>Multiple Yarn</h3>

        <div class="grid">
          <div>
            <label>Yarn Count (comma separated)</label>

            <input id="counts" value="10,10" placeholder="10,10,12" />
          </div>

          <div>
            <label>Distribution</label>

            <div class="radio distribution-controls">
              <label>
                <input
                  type="radio"
                  name="dist"
                  value="ratio"
                  checked
                  onchange="distChange()"
                />
                Ratio
              </label>

              <label>
                <input
                  type="radio"
                  name="dist"
                  value="percent"
                  onchange="distChange()"
                />
                %
              </label>

              <div id="ratioBox">
                <input id="ratio" value="1:2" placeholder="Ratio দিন" />
              </div>

              <div id="percentBox" style="display: none">
                <input
                  id="percent"
                  value="33,67"
                  placeholder="Percentage দিন"
                />
              </div>
            </div>
          </div>
        </div>
      </div>

      <button class="calc" onclick="calculate()">CALCULATE</button>

      <div id="error" class="error"></div>

      <div id="result" style="display: none">
        <h2>Final Result</h2>

        <div id="coneStatus"></div>

        <div class="table-wrap">
          <table>
            <thead id="thead"></thead>

            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="footer">
        © <span class="copyright">Asraful Islam</span> | All Rights Reserved.
      </div>
    </div>

    <script>
      function roundHalfUp(x) {
        return Math.floor(x + 0.5);
      }

      function vals(s) {
        return s
          .split(",")
          .map((x) => x.trim())
          .filter((x) => x !== "");
      }

      function modeChange() {
        const mode = document.querySelector('input[name="mode"]:checked').value;

        document.getElementById("singleInput").style.display =
          mode === "single" ? "block" : "none";

        document.getElementById("multipleInput").style.display =
          mode === "multiple" ? "block" : "none";
      }

      function distChange() {
        const dist = document.querySelector('input[name="dist"]:checked').value;

        document.getElementById("ratioBox").style.display =
          dist === "ratio" ? "block" : "none";

        document.getElementById("percentBox").style.display =
          dist === "percent" ? "block" : "none";
      }

      function calculate() {
        const error = document.getElementById("error");

        error.textContent = "";

        const teInput = document.getElementById("te").value.trim();

        const reedInput = document.getElementById("reed").value.trim();

        const epiInput = document.getElementById("epi").value.trim();

        const reed = reedInput === "" ? null : Number(reedInput);

        const epi = epiInput === "" ? null : Number(epiInput);

        const total = Number(document.getElementById("totalBall").value);

        const fabric = Number(document.getElementById("fabric").value);

        const wastage = Number(document.getElementById("wastage").value);

        if (!total || !fabric || wastage < 0) {
          error.textContent =
            "Total Ball, Yarn Length এবং Wastage সঠিকভাবে দিন।";

          return;
        }

        let TE;

        if (teInput !== "") {
          TE = Number(teInput);

          if (!Number.isFinite(TE) || TE <= 0) {
            error.textContent = "TE সঠিকভাবে দিন।";

            return;
          }
        } else {
          if (reedInput === "" || epiInput === "") {
            error.textContent =
              "TE না থাকলে EPI এবং Reed Space দুটোই দিতে হবে।";

            return;
          }

          if (
            !Number.isFinite(reed) ||
            reed <= 0 ||
            !Number.isFinite(epi) ||
            epi <= 0
          ) {
            error.textContent = "Reed Space এবং EPI সঠিকভাবে দিন।";

            return;
          }

          TE = reed * epi;
        }

        const cone = roundHalfUp(TE / total);

        let counts = [];
        let pct = [];
        let distribution = [];

        const type = document.querySelector('input[name="mode"]:checked').value;

        if (type === "single") {
          const count = Number(document.getElementById("singleCount").value);

          if (!count || count <= 0) {
            error.textContent = "Single Yarn-এর Count দিন।";

            return;
          }

          counts = [count];
          pct = [100];
        } else {
          counts = vals(document.getElementById("counts").value).map(Number);

          if (!counts.length) {
            error.textContent = "Yarn Count দিন।";
            return;
          }

          if (counts.some((x) => !Number.isFinite(x) || x <= 0)) {
            error.textContent = "Count-এ শুধু valid number দিন।";

            return;
          }

          const dist = document.querySelector(
            'input[name="dist"]:checked',
          ).value;

          if (dist === "ratio") {
            distribution = document
              .getElementById("ratio")
              .value.trim()
              .split(":")
              .map(Number);

            if (
              distribution.length !== counts.length ||
              distribution.some((x) => !Number.isFinite(x) || x <= 0)
            ) {
              error.textContent =
                "Ratio-এর সংখ্যা Yarn-এর সংখ্যার সমান হতে হবে।";

              return;
            }

            const sum = distribution.reduce((a, b) => a + b, 0);

            pct = distribution.map((x) => (x / sum) * 100);
          } else {
            pct = vals(document.getElementById("percent").value).map(Number);

            if (
              pct.length !== counts.length ||
              pct.some((x) => !Number.isFinite(x) || x < 0)
            ) {
              error.textContent =
                "Percentage-এর সংখ্যা Yarn-এর সংখ্যার সমান হতে হবে।";

              return;
            }

            const sum = pct.reduce((a, b) => a + b, 0);

            if (Math.abs(sum - 100) > 0.01) {
              error.textContent = `Percentage total 100% হতে হবে। এখন ${sum.toFixed(2)}%`;

              return;
            }

            distribution = pct;
          }
        }

        const st = document.getElementById("coneStatus");

        if (cone >= 340 && cone <= 480) {
          st.className = "ok";

          st.textContent = `✓ Cone ${cone} — 340–480 limit-এর মধ্যে।`;
        } else {
          st.className = "bad";

          st.textContent = `✗ Cone ${cone} — 340–480 limit-এর বাইরে।`;
        }

        const thead = document.getElementById("thead");

        const tbody = document.getElementById("tbody");

        tbody.innerHTML = "";

        if (type === "single") {
          thead.innerHTML = `
          <tr>
            <th>Count</th>
            <th>Ball</th>
            <th>Set Length (Mtr)</th>
            <th>Yarn Length (Meter)</th>
            <th>Per Cone Weight</th>
            <th>Requisition Quantity(KG)</th>
            <th>Number of Cone(Pcs)</th>
          </tr>
        `;

          const ball = roundHalfUp(total);

          const yarnLength = fabric * ball + wastage;

          const constant = 0.00059;

          const kg = (yarnLength * cone * constant) / counts[0];

          const gram = kg / cone;

          tbody.innerHTML = `
          <tr>

            <td>
              ${counts[0]}
            </td>

            <td>
              ${ball}
            </td>
            <td>
              ${yarnLength.toFixed(2)}
            </td>
            <td>
              ${gram.toFixed(2)} g
            </td>
            <td>
              ${fabric.toFixed(0)}
            </td>
            <td>
              ${kg.toFixed(3)}
            </td>

            <td>
              ${cone}
            </td>

          </tr>
        `;
        } else {
          thead.innerHTML = `
          <tr>
            <th>Count</th>
            <th>Value %</th>
            <th>Ball</th>
            <th>Set Length (Mtr)</th>
            <th>Yarn Length (Meter)</th>
            <th>Per Cone Weight</th>
            <th>Requisition Quantity(KG)</th>
            <th>Number of Cone(Pcs)</th>
          </tr>
        `;

          const constant = 0.00059;

          counts.forEach((count, i) => {
            const ball = roundHalfUp((total * pct[i]) / 100);

            const yarnLength = fabric * ball + wastage;

            const kg = (yarnLength * cone * constant) / counts[i];

            const gram = kg / cone;

            tbody.innerHTML += `
              <tr>

                <td>
                  ${count}
                </td>

                <td>
                  ${pct[i].toFixed(2)}%
                </td>

                <td>
                  ${ball}
                </td>

                <td>
                    ${yarnLength.toFixed(2)}
                </td>
                <td>
                    ${gram.toFixed(2)} g
                </td>

                <td>
                    ${fabric.toFixed(0)}
                </td>
                <td>
                    ${kg.toFixed(3)}
                </td>
                <td>
                  ${cone}
                </td>


              </tr>
            `;
          });
        }

        document.getElementById("result").style.display = "block";
      }

      modeChange();
      distChange();
    </script>
  </body>
</html>
