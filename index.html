<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Yarn Calculation</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f5f6f8;
        color: #111827;
        min-height: 100vh;
        padding: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        width: 100%;
        max-width: 430px;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        padding: 25px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
      }

      h1 {
        text-align: center;
        font-size: 23px;
        margin-bottom: 5px;
      }

      .subtitle {
        text-align: center;
        color: #6b7280;
        font-size: 12px;
        margin-bottom: 22px;
      }

      .option {
        display: block;
        position: relative;
        margin-bottom: 10px;
      }

      .option input {
        position: absolute;
        opacity: 0;
      }

      .option label {
        display: flex;
        align-items: center;
        gap: 10px;

        padding: 14px;
        border: 1px solid #d7dce3;
        border-radius: 9px;

        cursor: pointer;
        font-size: 14px;
        font-weight: 600;

        transition: 0.2s;
      }

      .option label::before {
        content: "";
        width: 15px;
        height: 15px;
        border: 1.5px solid #9ca3af;
        border-radius: 50%;
      }

      .option input:checked + label {
        background: #111827;
        border-color: #111827;
        color: white;
      }

      .option input:checked + label::before {
        border: 4px solid white;
      }

      button {
        width: 100%;
        height: 43px;
        margin-top: 10px;

        border: 0;
        border-radius: 8px;

        background: #111827;
        color: white;

        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: #252b36;
      }

      .footer {
        text-align: center;
        margin-top: 18px;
        color: #9ca3af;
        font-size: 10px;
      }

      @media (max-width: 480px) {
        body {
          padding: 9px;
        }

        .card {
          padding: 20px 16px;
        }

        h1 {
          font-size: 20px;
        }
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>Yarn Calculation</h1>

      <p class="subtitle">Select yarn calculation type</p>

      <div class="option">
        <input type="radio" name="yarnType" id="warp" value="warp" checked />

        <label for="warp"> Warp Yarn </label>
      </div>

      <div class="option">
        <input type="radio" name="yarnType" id="weft" value="weft" />

        <label for="weft"> Weft Yarn </label>
      </div>

      <button onclick="openCalculator()">CONTINUE</button>

      <div class="footer">© 2026 Asraful. All Rights Reserved.</div>
    </div>

    <script>
      function openCalculator() {
        const type = document.querySelector(
          'input[name="yarnType"]:checked',
        ).value;

        if (type === "warp") {
          window.location.href = "warp.html";
        } else {
          window.location.href = "weft.html";
        }
      }
    </script>
  </body>
</html>
